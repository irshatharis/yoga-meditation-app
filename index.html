    <style>
      html { background: #f5efe5; color: #2a241d; }
      @media (prefers-color-scheme: dark) { html { background: #15130f; color: #ece4d6; } }
      .boot { min-height: 100dvh; display: grid; place-items: center; }
      .boot span { width: 56px; height: 56px; border-radius: 50%; background: #c0603f; opacity: .85; animation: boot 2.4s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(1.15); opacity: .55; } }
      /* Prerendered text for crawlers and slow connections. It waits two seconds so a normal boot never flashes it. */
      .boot-copy { position: absolute; left: 0; right: 0; max-width: 36em; margin: 0 auto; padding: 32px 20px 64px; font: 17px/1.55 Georgia, serif; opacity: 0; animation: show .4s 2s forwards; }
      .boot-copy ~ .boot { animation: gone 0s 2s forwards; }
      .boot-copy a { color: inherit; }
      @keyframes show { to { opacity: 1; } }
      @keyframes gone { to { visibility: hidden; } }
    </style>
